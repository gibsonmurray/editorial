[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "editorial-cli"
version = "0.1.0"
description = "A DOCX manuscript CLI for context-aware editorial suggestions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Private" }
authors = [{ name = "Gibson Murray" }]
dependencies = ["rich>=13.7"]

[project.optional-dependencies]
dev = ["mypy>=1.13"]

[project.scripts]
editorial = "editorial_cli.cli:main"

[tool.setuptools]
packages = ["editorial_cli"]
py-modules = ["editorial_suggestions"]

[tool.setuptools.package-data]
editorial_cli = ["py.typed"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true
files = ["editorial_cli", "editorial_suggestions.py", "tests"]
