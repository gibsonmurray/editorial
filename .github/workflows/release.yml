name: Release

on:
    push:
        branches: [main]

# Cancel any in-flight release run for the same branch
concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: true

jobs:
    release:
        # Skip if this push is itself the version-bump commit
        if: "!contains(github.event.head_commit.message, '[skip ci]')"
        runs-on: ubuntu-latest

        permissions:
            contents: write # push version commit + tag

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # full history needed for tag detection
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Configure git
              run: |
                  git config user.name  "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            # ── Determine bump type from commits since last tag ───────────────────
            - name: Determine version bump
              id: bump
              run: |
                  LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
                  if [ -z "$LAST_TAG" ]; then
                    COMMITS=$(git log --pretty=format:"%s")
                  else
                    COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=format:"%s")
                  fi

                  echo "Commits since last tag:"
                  echo "$COMMITS"

                  if echo "$COMMITS" | grep -qE "BREAKING[[:space:]]CHANGE|^[a-z]+(\(.+\))?!:"; then
                    BUMP=major
                  elif echo "$COMMITS" | grep -qE "^feat(\(.+\))?:"; then
                    BUMP=minor
                  else
                    BUMP=patch
                  fi

                  echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
                  echo "Bump type: $BUMP"

            # ── Bump package.json (no git tag yet — we tag after build succeeds) ──
            - name: Bump package.json version
              id: version
              run: |
                  NEW_VERSION=$(npm version ${{ steps.bump.outputs.bump }} --no-git-tag-version)
                  echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
                  echo "New version: $NEW_VERSION"

            # ── Install & build ───────────────────────────────────────────────────
            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build
              run: bun run build

            # ── Pull the vercel build output (prebuilt deploy) ────────────────────
            - name: Pull Vercel environment
              run: bunx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
              env:
                  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
                  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

            - name: Deploy to Vercel (production)
              id: deploy
              run: |
                  URL=$(bunx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
                  echo "url=$URL" >> "$GITHUB_OUTPUT"
                  echo "Deployed to: $URL"
              env:
                  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
                  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

            # ── Commit version bump + tag (only after a successful deploy) ────────
            - name: Commit and tag release
              run: |
                  git add package.json
                  git commit -m "chore: release ${{ steps.version.outputs.version }} [skip ci]"
                  git tag ${{ steps.version.outputs.version }}
                  git push origin main --follow-tags
